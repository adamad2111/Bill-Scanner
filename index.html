<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milandhoo HC Bill Entry 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.56);
      --glass-bg-strong: rgba(255, 255, 255, 0.82);
      --glass-border: rgba(255, 255, 255, 0.72);
      --shadow-spatial: 0 24px 60px -15px rgba(15, 23, 42, 0.14), 0 4px 18px -4px rgba(15, 23, 42, 0.06);
    }

    * {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background-color: #eef2f9;
      background-image:
        radial-gradient(at 8% 10%, rgba(125, 211, 252, 0.55) 0px, transparent 52%),
        radial-gradient(at 88% 12%, rgba(196, 181, 253, 0.52) 0px, transparent 50%),
        radial-gradient(at 78% 85%, rgba(253, 186, 116, 0.35) 0px, transparent 52%),
        radial-gradient(at 15% 88%, rgba(167, 243, 208, 0.45) 0px, transparent 52%);
      background-attachment: fixed;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* iOS 27 Liquid Glass Surface */
    .liquid-glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(195%);
      -webkit-backdrop-filter: blur(28px) saturate(195%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-spatial), inset 0 1px 1px rgba(255, 255, 255, 0.85);
    }

    .liquid-glass-strong {
      position: relative;
      background: var(--glass-bg-strong);
      backdrop-filter: blur(36px) saturate(210%);
      -webkit-backdrop-filter: blur(36px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow-spatial), inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95);
    }

    /* Squircle-inspired organic radii */
    .squircle-xl { border-radius: 30px; }
    .squircle-lg { border-radius: 22px; }
    .squircle-md { border-radius: 16px; }

    /* Fluid Spring Micro-interactions */
    .spring-btn {
      transition: transform 0.36s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.28s ease, background-color 0.25s ease;
    }
    .spring-btn:hover { transform: translateY(-2px) scale(1.015); }
    .spring-btn:active { transform: scale(0.965); }

    /* Dynamic Island Pill */
    .dynamic-island {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28), inset 0 1px 0.5px rgba(255, 255, 255, 0.22);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Laser Scan Animation */
    @keyframes scanLaser {
      0% { top: 4%; opacity: 0.2; }
      15% { opacity: 1; }
      50% { top: 92%; opacity: 1; }
      85% { opacity: 1; }
      100% { top: 4%; opacity: 0.2; }
    }
    .scan-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, #38bdf8, transparent);
      box-shadow: 0 0 18px 4px rgba(56, 189, 248, 0.75);
      animation: scanLaser 2.2s ease-in-out infinite;
      z-index: 20;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.25); border-radius: 999px; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.35); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.55); }

    /* iOS Input styling */
    .ios-input {
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(148, 163, 184, 0.32);
      transition: all 0.25s ease;
    }
    .ios-input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.95);
      border-color: #0284c7;
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.14);
    }
  </style>
</head>
<body class="antialiased selection:bg-sky-500/20 selection:text-sky-900 pb-16">

  <!-- iOS 27 Dynamic Island Status Pill -->
  <div class="fixed top-3 left-1/2 -translate-x-1/2 z-50 w-auto max-w-[92vw]">
    <div id="dynamicIsland" class="dynamic-island text-white px-4 py-2 rounded-full flex items-center gap-3 text-xs sm:text-sm font-medium">
      <span id="islandDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
      <span id="islandText" class="truncate">Milandhoo HC • Register Ready</span>
      <span id="islandBadge" class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] bg-white/15 text-sky-200 font-semibold">
        2026
      </span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="max-w-[1440px] mx-auto px-4 sm:px-6 lg:px-8 pt-16 sm:pt-20">

    <!-- Top Spatial Navigation & Google Sheets Sync Bar -->
    <header class="liquid-glass squircle-xl p-5 sm:p-6 mb-6 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
      <div class="flex items-start sm:items-center gap-4">
        <div class="w-13 h-13 sm:w-14 sm:h-14 squircle-md bg-gradient-to-br from-sky-5
